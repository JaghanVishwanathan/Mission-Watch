# Local development stack.
#
#   docker compose -f deployment/docker/compose.yaml up -d postgres        # database only (run the API from your IDE or mvnw)
#   docker compose -f deployment/docker/compose.yaml --profile api up -d   # database + API container
#
# Credentials come from deployment/docker/.env (copy .env.example); the defaults are for local use only.
name: missionwatch

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: missionwatch
      POSTGRES_USER: ${DB_USER:-missionwatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-missionwatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [api]
    build:
      context: ../../backend/missionwatch-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/missionwatch
      DB_USER: ${DB_USER:-missionwatch}
      DB_PASSWORD: ${DB_PASSWORD:-missionwatch}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
