# Local development stack.
#
#   docker compose -f deployment/docker/compose.yaml up -d mysql           # database only (run the API from your IDE or mvnw)
#   docker compose -f deployment/docker/compose.yaml --profile api up -d   # database + API container
#
# Credentials come from deployment/docker/.env (copy .env.example); the defaults are for local use only.
name: missionwatch

services:
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: missionwatch
      MYSQL_USER: ${DB_USER:-missionwatch}
      MYSQL_PASSWORD: ${DB_PASSWORD:-missionwatch}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-missionwatch-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    profiles: [api]
    build:
      context: ../../backend/missionwatch-api
    environment:
      DB_URL: jdbc:mysql://mysql:3306/missionwatch?connectionTimeZone=UTC
      DB_USER: ${DB_USER:-missionwatch}
      DB_PASSWORD: ${DB_PASSWORD:-missionwatch}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
