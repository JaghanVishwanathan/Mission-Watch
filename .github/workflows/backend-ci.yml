name: Backend CI

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: backend/missionwatch-api

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Formatting (Spotless), unit tests, MySQL integration tests (Testcontainers; the
      # runner has Docker) and architecture rules (ArchUnit).
      - name: Verify
        run: ./mvnw -B verify

      - name: Container image builds
        run: docker build -t missionwatch-api:ci .
