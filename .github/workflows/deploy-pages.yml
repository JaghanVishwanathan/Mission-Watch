name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
  # Weekly rebuild refreshes the GCAT history snapshot used by the Analytics page.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/missionwatch-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/missionwatch-web/package-lock.json

      - run: npm ci

      - name: Build GCAT history snapshot
        run: npm run data:history

      - name: Build
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages has no SPA rewrites; serve the app shell for unknown paths.
      - name: SPA fallback
        run: cp dist/missionwatch-web/browser/index.html dist/missionwatch-web/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/missionwatch-web/dist/missionwatch-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
